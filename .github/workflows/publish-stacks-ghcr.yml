name: Build, Smoke-Test & Publish 16 Modernized Stacks to GHCR

on:
  push:
    branches: [main]
    paths:
      - 'stacks/**'
      - '.github/workflows/publish-stacks-ghcr.yml'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish-stacks:
    name: ${{ matrix.stack }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        stack:
          - holo-nginx
          - holo-haproxy
          - holo-varnish
          - holo-httpd
          - holo-postgres
          - holo-mariadb
          - holo-valkey
          - holo-mongodb
          - holo-solr
          - holo-go
          - holo-deno
          - holo-git
          - holo-wordpress
          - holo-ghost
          - holo-redmine
          - holo-squid
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build linux/amd64 smoke image
        uses: docker/build-push-action@v7
        with:
          context: stacks/${{ matrix.stack }}
          file: stacks/${{ matrix.stack }}/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ghcr.io/awesome-os/${{ matrix.stack }}:smoke
      - name: Smoke-test linux/amd64 stack container
        env:
          STACK_NAME: ${{ matrix.stack }}
          SMOKE_REF: ghcr.io/awesome-os/${{ matrix.stack }}:smoke
        run: node catalog/oci-smoke.mts --mode stack --name "$STACK_NAME" --image "$SMOKE_REF"
      - name: Build & push multi-arch OCI manifest
        uses: docker/build-push-action@v7
        with:
          context: stacks/${{ matrix.stack }}
          file: stacks/${{ matrix.stack }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ghcr.io/awesome-os/${{ matrix.stack }}:latest
      - name: Verify published multi-arch OCI manifest list
        env:
          LATEST_REF: ghcr.io/awesome-os/${{ matrix.stack }}:latest
        run: node catalog/oci-smoke.mts --mode verify-manifest --image "$LATEST_REF"
