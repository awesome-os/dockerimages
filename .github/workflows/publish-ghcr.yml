name: Build, Smoke-Test & Publish OCI Images to GHCR

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        image: [t2linux, holo-node, holo-py, holo-cpp, holo-jvm, holo-php, holo-ruby, holo-e2e-runner, holo-e2e-lite]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build linux/amd64 smoke image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image }}
          file: ${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ghcr.io/awesome-os/${{ matrix.image }}:smoke
      - name: Smoke-test linux/amd64 container
        env:
          IMAGE_NAME: ${{ matrix.image }}
          SMOKE_REF: ghcr.io/awesome-os/${{ matrix.image }}:smoke
        run: node catalog/oci-smoke.mts --mode base --name "$IMAGE_NAME" --image "$SMOKE_REF"
      - name: Build linux/arm64 holo-node smoke image
        if: matrix.image == 'holo-node'
        uses: docker/build-push-action@v7
        with:
          context: holo-node
          file: holo-node/Dockerfile
          platforms: linux/arm64
          load: true
          push: false
          tags: ghcr.io/awesome-os/holo-node:smoke-arm64
      - name: Smoke-test linux/arm64 holo-node under QEMU
        if: matrix.image == 'holo-node'
        run: node catalog/oci-smoke.mts --mode base --name holo-node --image ghcr.io/awesome-os/holo-node:smoke-arm64 --platform linux/arm64
      - name: Export and publish E2E OCI tarball (v11-oci-latest)
        env:
          IMAGE_NAME: ${{ matrix.image }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node catalog/oci-smoke.mts --mode export-e2e --name "$IMAGE_NAME" --tag v11-oci-latest --repo awesome-os/dockerimages
      - name: Build & push multi-arch OCI manifest
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image }}
          file: ${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ghcr.io/awesome-os/${{ matrix.image }}:latest
      - name: Verify published multi-arch OCI manifest list
        env:
          LATEST_REF: ghcr.io/awesome-os/${{ matrix.image }}:latest
        run: node catalog/oci-smoke.mts --mode verify-manifest --image "$LATEST_REF"
