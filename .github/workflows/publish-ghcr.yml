name: Build, Smoke-Test & Publish OCI Images to GHCR

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        image:
          - t2linux
          - holo-node
          - holo-py
          - holo-cpp
          - holo-jvm
          - holo-php
          - holo-ruby
          - holo-e2e-runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build linux/amd64 image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          file: ${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ghcr.io/awesome-os/${{ matrix.image }}:smoke

      - name: Smoke-test linux/amd64 container and print image size
        run: |
          IMAGE="ghcr.io/awesome-os/${{ matrix.image }}:smoke"
          SIZE="$(docker images --format '{{.Size}}' "${IMAGE}" | head -n 1)"
          echo "=== IMAGE SIZE (linux/amd64): ${IMAGE} -> ${SIZE} ==="
          case "${{ matrix.image }}" in
            t2linux)
              docker run --rm "${IMAGE}" -c '
                set -eu
                cat /etc/t2linux-release
                /bin/coreutils --version | head -n 1
                ls -la /bin/busybox /bin/sh /bin/coreutils /bin/holo-pm /etc/ssl/certs/ca-certificates.crt
                test -x /bin/busybox
                test -x /bin/coreutils
                test -x /bin/holo-pm
                test -s /etc/ssl/certs/ca-certificates.crt
                test "$B8G_CAS_DIR" = "/var/lib/b8g/cas"
                test "$B8G_CAS_V11_ROOT" = "/var/lib/b8g/cas/v11"
                echo "[smoke] t2linux OK (B8G_CAS_V11_ROOT=$B8G_CAS_V11_ROOT)"
              '
              ;;
            holo-node)
              docker run --rm "${IMAGE}" sh -c '
                set -eu
                NODE_V="$(node -v)"
                echo "node -v -> ${NODE_V}"
                case "${NODE_V}" in
                  v27.*) ;;
                  *) echo "ERROR: expected Node v27.x on linux/amd64, got ${NODE_V}" >&2; exit 1 ;;
                esac
                /bin/coreutils --version | head -n 1
                ls -la /bin/busybox /bin/coreutils /bin/holo-pm /usr/local/bin/holo-node-launcher /etc/ssl/certs/ca-certificates.crt
                test -x /bin/coreutils
                test -x /bin/holo-pm
                test -x /usr/local/bin/holo-node-launcher
                test "$B8G_CAS_DIR" = "/var/lib/b8g/cas"
                test "$B8G_CAS_V11_ROOT" = "/var/lib/b8g/cas/v11"
                echo "[smoke] holo-node OK (${NODE_V})"
              '
              ;;
            holo-py)
              docker run --rm "${IMAGE}" sh -c '
                set -eu
                python3 --version
                ls -la /bin/busybox /bin/holo-pm /etc/ssl/certs/ca-certificates.crt
                test -x /bin/holo-pm
                test "$B8G_CAS_DIR" = "/var/lib/b8g/cas"
                test "$B8G_CAS_V11_ROOT" = "/var/lib/b8g/cas/v11"
                echo "[smoke] holo-py OK"
              '
              ;;
            holo-cpp)
              docker run --rm "${IMAGE}" sh -c '
                set -eu
                ls -la /bin/busybox /bin/holo-pm /usr/local/include/libholo_pm.h /usr/local/lib/libholo-pm.so /usr/include/stdio.h /etc/ssl/certs/ca-certificates.crt
                test -x /bin/holo-pm
                test "$B8G_CAS_DIR" = "/var/lib/b8g/cas"
                test "$B8G_CAS_V11_ROOT" = "/var/lib/b8g/cas/v11"
                echo "[smoke] holo-cpp OK"
              '
              ;;
            holo-jvm)
              docker run --rm "${IMAGE}" sh -c '
                set -eu
                java -version
                ls -la /bin/busybox /bin/holo-pm /etc/ssl/certs/ca-certificates.crt
                test -x /bin/holo-pm
                test "$B8G_CAS_DIR" = "/var/lib/b8g/cas"
                test "$B8G_CAS_V11_ROOT" = "/var/lib/b8g/cas/v11"
                echo "[smoke] holo-jvm OK"
              '
              ;;
            holo-php)
              docker run --rm "${IMAGE}" sh -c '
                set -eu
                php -v
                composer --version
                ls -la /bin/busybox /bin/holo-pm /usr/local/bin/composer /etc/ssl/certs/ca-certificates.crt
                test -x /bin/holo-pm
                test "$B8G_CAS_DIR" = "/var/lib/b8g/cas"
                test "$B8G_CAS_V11_ROOT" = "/var/lib/b8g/cas/v11"
                test "$COMPOSER_CACHE_DIR" = "/var/lib/b8g/cas/v11/composer"
                echo "[smoke] holo-php OK"
              '
              ;;
            holo-ruby)
              docker run --rm "${IMAGE}" sh -c '
                set -eu
                ruby -v
                bundle --version
                ls -la /bin/busybox /bin/holo-pm /etc/ssl/certs/ca-certificates.crt
                test -x /bin/holo-pm
                test "$B8G_CAS_DIR" = "/var/lib/b8g/cas"
                test "$B8G_CAS_V11_ROOT" = "/var/lib/b8g/cas/v11"
                test "$BUNDLE_CACHE_PATH" = "/var/lib/b8g/cas/v11/gems"
                echo "[smoke] holo-ruby OK"
              '
              ;;
            holo-e2e-runner)
              docker run --rm "${IMAGE}" sh -c '
                set -eu
                node -v && gcc --version | head -n 1 && g++ --version | head -n 1 && test -x /bin/holo-pm && /usr/local/bin/holo-e2e-probe --out /tmp/probe.bmp && ls -la /usr/share/vulkan/icd.d/
                echo "[smoke] holo-e2e-runner OK"
              '
              ;;
          esac

      - name: Export and publish public holo-e2e-runner OCI tarball (v11-oci-latest)
        if: matrix.image == 'holo-e2e-runner'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          docker tag ghcr.io/awesome-os/holo-e2e-runner:smoke ghcr.io/awesome-os/holo-e2e-runner:latest
          docker save ghcr.io/awesome-os/holo-e2e-runner:latest | gzip -6 > /tmp/holo-e2e-runner-linux-amd64.oci.tar.gz
          (cd /tmp && sha512sum holo-e2e-runner-linux-amd64.oci.tar.gz > SHA512SUMS-holo-e2e-runner.txt)
          ls -lh /tmp/holo-e2e-runner-linux-amd64.oci.tar.gz /tmp/SHA512SUMS-holo-e2e-runner.txt
          cat /tmp/SHA512SUMS-holo-e2e-runner.txt
          gh release view v11-oci-latest --repo awesome-os/dockerimages >/dev/null 2>&1 || \
            gh release create v11-oci-latest \
              --repo awesome-os/dockerimages \
              --title "Awesome-OS Holo v11 Public OCI Images (v11-oci-latest)" \
              --notes "Public SHA-512 verified OCI container bundles for zero-GHCR-auth clean-box Holo-E2E execution."
          gh release upload v11-oci-latest \
            /tmp/holo-e2e-runner-linux-amd64.oci.tar.gz \
            /tmp/SHA512SUMS-holo-e2e-runner.txt \
            --repo awesome-os/dockerimages \
            --clobber

      - name: Build & push multi-arch OCI manifest (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          file: ${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ghcr.io/awesome-os/${{ matrix.image }}:latest

      - name: Verify published multi-arch OCI manifest list
        run: |
          IMAGE="ghcr.io/awesome-os/${{ matrix.image }}:latest"
          RAW="$(docker buildx imagetools inspect --raw "${IMAGE}")"
          echo "=== OCI MANIFEST LIST: ${IMAGE} ==="
          docker buildx imagetools inspect "${IMAGE}"
          printf '%s' "${RAW}" | jq -e '
            (.manifests | map(.platform.os + "/" + .platform.architecture)) as $p |
            ($p | index("linux/amd64") != null) and ($p | index("linux/arm64") != null)
          '
          echo "[verify] ${IMAGE} confirmed linux/amd64 + linux/arm64"
